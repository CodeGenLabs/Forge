# forge project configuration.
#
# Everything here has a default; the kernel runs with no config at all. Only the
# keys the current milestones read are listed.

derive:
  # Files whose ID-looking strings are *data*, not declarations. They still
  # count in the inventory and the test totals; only `@covers` and `forge:<ID>`
  # harvesting skips them.
  #
  # This repository is the pathological case for its own scanner: the test
  # suite is built out of exactly the strings the scanner looks for, and the
  # measurement tools embed example IDs in their documentation. Indexing those
  # produced eight dangling references against an empty store.
  #
  # A normal project would NOT list its tests here - `@covers` belongs in tests
  # and is the entire point of the tag. This entry is a property of building
  # the tool, not advice about using it.
  exclude_id_scan:
    - "tests/*"
    - "tools/*"

# Detected by `forge bootstrap seal` from this project's manifests.
# Nothing here was guessed from a file merely existing: an unproven
# verification condition is better than one proven by a command
# nobody chose.
commands:
  # `none` says this project has no such step, which is a different answer
  # from saying nothing - that would mean nobody has declared one yet.
  # A pure-Python library builds by being installed and has no compile
  # step; there is no typechecker configured here either.
  build: none
  typecheck: none
  # This suite takes longer than the kernel's 900s default, so `tests`
  # reported `unavailable` on every run - correctly, but uselessly.
  timeout: 2400
  # Not the bare `pytest` that `forge bootstrap seal` detected from the
  # manifest: `forge verify` runs this line through the shell, and a bare
  # console script is only on PATH when the virtualenv is activated. Every
  # run without it reported the suite failing when the suite passed, which
  # is the one thing a verification report must never do.
  # Backslashes: this line is handed to the host shell, and cmd.exe rejects
  # a leading `.venv/...`. The kernel has no notion of how to spell a path
  # for the shell it will be run under, so the config carries the host's
  # spelling and a project on two platforms needs two configs.
  test: .venv\Scripts\python.exe -m pytest -q
